openapi: 3.0.1
info:
  contact:
    name: Polarion REST API Support
    url: https://support.sw.siemens.com/
  description: <h5>About</h5>The Polarion REST API lets you interact with Polarion programmatically. Use this API to integrate Polarion with your applications. This page documents the REST resources, including the HTTP response codes and example requests and responses. <br/><br/>For a detailed description of the REST API and how to use it, see the <a href="https://docs.sw.siemens.com/en-US/doc/230235217/PL20250606201928474.polarion_help_sc.xid2134849/xid2134871" target="_blank">REST API User Guide</a> (available on Support Center).
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: Polarion REST Account User Groups API
  version: v1
servers:
- url: https://example.com/polarion/rest/v1
security:
- bearerAuth: []
tags:
- name: User Groups
paths:
  /usergroups/{groupId}:
    get:
      operationId: getUserGroup
      parameters:
      - name: groupId
        in: path
        description: The Group ID.
        required: true
        schema:
          type: string
      - name: fields
        in: query
        description: Filter returned resource fields. See <a href="https://docs.sw.siemens.com/en-US/doc/230235217/PL20250606201928474.polarion_help_sc.xid2134849/xid2134871" target="_blank">REST API User Guide</a> for details.
        style: deepObject
        schema:
          $ref: '#/components/schemas/sparseFields'
      - name: include
        in: query
        description: Include related entities. See <a href="https://docs.sw.siemens.com/en-US/doc/230235217/PL20250606201928474.polarion_help_sc.xid2134849/xid2134871" target="_blank">REST API User Guide</a> for details.
        schema:
          type: string
      - name: revision
        in: query
        description: The revision ID.
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/usergroupsSingleGetResponse'
          description: OK
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '406':
          description: Not Acceptable
        4XX-5XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
          description: 'Error responses have the following structure:'
        '500':
          description: Internal Server Error
        '503':
          description: Service Unavailable
      summary: Returns the specified User Group.
      tags:
      - User Groups
components:
  schemas:
    usergroupsSingleGetResponse:
      properties:
        data:
          properties:
            type:
              enum:
              - usergroups
              type: string
            id:
              example: MyUserGroupId
              type: string
            revision:
              example: '1234'
              type: string
            attributes:
              properties:
                description:
                  properties:
                    type:
                      enum:
                      - text/plain
                      type: string
                    value:
                      example: My text value
                      type: string
                  type: object
                id:
                  example: MyUserGroupId
                  type: string
                ldapSearchFilter:
                  example: LDAP Search Filter
                  type: string
                name:
                  example: Name
                  type: string
                ssoSynchronizationAllowed:
                  type: boolean
              type: object
            relationships:
              properties:
                globalRoles:
                  properties:
                    data:
                      items:
                        properties:
                          id:
                            example: MyRoleId
                            type: string
                          type:
                            enum:
                            - globalroles
                            type: string
                        type: object
                      type: array
                    meta:
                      properties:
                        totalCount:
                          format: int32
                          type: integer
                      type: object
                  type: object
                projectRoles:
                  properties:
                    data:
                      items:
                        properties:
                          id:
                            example: MyProjectId/MyRoleId
                            type: string
                          type:
                            enum:
                            - projectroles
                            type: string
                        type: object
                      type: array
                    meta:
                      properties:
                        totalCount:
                          format: int32
                          type: integer
                      type: object
                  type: object
                users:
                  properties:
                    data:
                      items:
                        properties:
                          id:
                            example: MyUserId
                            type: string
                          revision:
                            example: '1234'
                            type: string
                          type:
                            enum:
                            - users
                            type: string
                        type: object
                      type: array
                    meta:
                      properties:
                        totalCount:
                          format: int32
                          type: integer
                      type: object
                  type: object
              type: object
            links:
              properties:
                self:
                  example: server-host-name/application-path/usergroups/MyUserGroupId
                  type: string
              type: object
            meta:
              properties:
                errors:
                  items:
                    properties:
                      detail:
                        description: Human-readable explanation specific to this occurrence of the problem.
                        example: 'Unexpected token, BEGIN_ARRAY expected, but was : BEGIN_OBJECT (at $.data)'
                        type: string
                      source:
                        properties:
                          parameter:
                            description: String indicating which URI query parameter caused the error.
                            example: revision
                            type: string
                          pointer:
                            description: JSON Pointer to the associated entity in the request document.
                            example: $.data
                            type: string
                          resource:
                            description: Resource causing the error.
                            properties:
                              id:
                                example: MyProjectId/id
                                type: string
                              type:
                                example: type
                                type: string
                            type: object
                        type: object
                      status:
                        description: HTTP status code applicable to this problem.
                        example: '400'
                        type: string
                      title:
                        description: Short, human-readable summary of the problem.
                        example: Bad Request
                        type: string
                    type: object
                  type: array
              type: object
          type: object
        included:
          description: Related entities might be returned, see <a href="https://docs.sw.siemens.com/en-US/doc/230235217/PL20250606201928474.polarion_help_sc.xid2134849/xid2134871" target="_blank">REST API User Guide</a>.
          items:
            type: object
          type: array
        links:
          properties:
            self:
              example: server-host-name/application-path/usergroups/MyUserGroupId
              type: string
          type: object
      type: object
