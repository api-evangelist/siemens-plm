                name:
                  example: example
                  type: string
                state:
                  example: example
                  type: string
                status:
                  properties:
                    message:
                      example: message
                      type: string
                    type:
                      enum:
                      - OK
                      - CANCELLED
                      - FAILED
                      - UNKNOWN
                      type: string
                  type: object
              type: object
            relationships:
              properties:
                document:
                  properties:
                    data:
                      properties:
                        id:
                          example: MyProjectId/MySpaceId/MyDocumentId
                          type: string
                        type:
                          enum:
                          - documents
                          type: string
                      type: object
                  type: object
                documents:
                  properties:
                    data:
                      items:
                        properties:
                          id:
                            example: MyProjectId/MySpaceId/MyDocumentId
                            type: string
                          type:
                            enum:
                            - documents
                            type: string
                        type: object
                      type: array
                  type: object
                project:
                  properties:
                    data:
                      properties:
                        id:
                          example: MyProjectId
                          type: string
                        type:
                          enum:
                          - projects
                          type: string
                      type: object
                  type: object
              type: object
            links:
              properties:
                downloads:
                  example:
                  - https://example.com/polarion/download/filename1
                  - https://example.com/polarion/download/filename2
                  type: array
                log:
                  example: server-host-name/application-path/polarion/job-report?jobId=MyJobId
                  type: string
                self:
                  example: server-host-name/application-path/jobs/MyJobId
                  type: string
              type: object
          type: object
      type: object
    jobsSingleGetResponse:
      properties:
        data:
          properties:
            type:
