          description: Id of job factory, e.g. jobs.cleanup
          example: MyJobId
          nullable: false
          type: string
        name:
          example: My Job
          nullable: false
          type: string
        nodeId:
          example: MyNodeId
          nullable: true
          type: string
        params:
          description: Parameters of Job to be executed.
          nullable: true
          properties:
            param1:
              example: value1
              type: string
            param2:
              example: value2
              type: string
          type: object
