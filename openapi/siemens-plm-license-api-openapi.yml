components:
  schemas:
    license_slotsListGetResponse:
      properties:
        data:
          items:
            properties:
              type:
                enum:
                - license_slots
                type: string
              id:
                example: LicenseType/ModelType/GroupId
                type: string
              attributes:
                properties:
                  configured:
                    format: int32
                    type: integer
                  expirationDate:
                    format: date
                    type: string
                  free:
                    format: int32
                    type: integer
                  group:
                    example: groupName
                    type: string
                  model:
                    example: named
                    type: string
                  peak:
                    format: int32
                    type: integer
                  total:
                    format: int32
                    type: integer
                type: object
              links:
                properties:
                  self:
                    example: server-host-name/application-path/license/types/LicenseType/slots/ModelType/GroupId
                    type: string
                type: object
              meta:
                properties:
                  errors:
                    items:
                      properties:
                        detail:
                          description: Human-readable explanation specific to this occurrence of the problem.
                          example: 'Unexpected token, BEGIN_ARRAY expected, but was : BEGIN_OBJECT (at $.data)'
                          type: string
                        source:
                          properties:
                            parameter:
                              description: String indicating which URI query parameter caused the error.
                              example: revision
                              type: string
                            pointer:
                              description: JSON Pointer to the associated entity in the request document.
                              example: $.data
                              type: string
                            resource:
                              description: Resource causing the error.
                              properties:
                                id:
                                  example: MyProjectId/id
                                  type: string
                                type:
                                  example: type
                                  type: string
                              type: object
                          type: object
                        status:
                          description: HTTP status code applicable to this problem.
                          example: '400'
                          type: string
                        title:
                          description: Short, human-readable summary of the problem.
                          example: Bad Request
                          type: string
                      type: object
                    type: array
                type: object
            type: object
          type: array
        included:
          description: Related entities might be returned, see <a href="https://docs.sw.siemens.com/en-US/doc/230235217/PL20250606201928474.polarion_help_sc.xid2134849/xid2134871" target="_blank">REST API User Guide</a>.
          items:
            type: object
          type: array
        links:
          properties:
            first:
              example: server-host-name/application-path/license/types/LicenseType/slots/ModelType?page%5Bsize%5D=10&page%5Bnumber%5D=1
              type: string
            last:
              example: server-host-name/application-path/license/types/LicenseType/slots/ModelType?page%5Bsize%5D=10&page%5Bnumber%5D=9
              type: string
            next:
              example: server-host-name/application-path/license/types/LicenseType/slots/ModelType?page%5Bsize%5D=10&page%5Bnumber%5D=6
              type: string
            prev:
              example: server-host-name/application-path/license/types/LicenseType/slots/ModelType?page%5Bsize%5D=10&page%5Bnumber%5D=4
              type: string
            self:
              example: server-host-name/application-path/license/types/LicenseType/slots/ModelType?page%5Bsize%5D=10&page%5Bnumber%5D=5
              type: string
          type: object
        meta:
          properties:
            totalCount:
              format: int32
              type: integer
          type: object
      type: object
    licenseSinglePatchRequest:
      properties:
        data:
          properties:
            type:
              enum:
              - license
              type: string
            id:
              example: license
              type: string
            relationships:
              properties:
                defaultAddOnLicenseSlots:
                  properties:
                    data:
                      items:
                        properties:
                          id:
                            example: LicenseType/ModelType/GroupId
                            type: string
                          type:
                            enum:
                            - license_slots
                            type: string
                        type: object
                      type: array
                  type: object
                defaultBaseLicenseSlot:
                  properties:
                    data:
                      properties:
                        id:
                          example: LicenseType/ModelType/GroupId
                          type: string
                        type:
                          enum:
                          - license_slots
                          type: string
                      type: object
                  type: object
              type: object
          type: object
      type: object
    licenseSingleGetResponse:
      properties:
        data:
          properties:
            type:
              enum:
              - license
              type: string
            id:
              example: license
              type: string
            attributes:
              properties:
                limits:
                  properties:
                    documentsAndPages:
                      properties:
                        currentCount:
                          type: integer
                        limit:
                          type: integer
                      type: object
                    projects:
                      properties:
                        currentCount:
                          type: integer
                        limit:
                          type: integer
                      type: object
                    workitems:
                      properties:
                        currentCount:
                          type: integer
                        limit:
                          type: integer
                      type: object
                  type: object
              type: object
            relationships:
              properties:
                defaultAddOnLicenseSlots:
