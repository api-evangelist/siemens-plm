          items:
            properties:
              type:
                enum:
                - testparameters
                type: string
              id:
                example: MyProjectId/MyTestRunId/MyTestParameter
                type: string
              revision:
                example: '1234'
                type: string
              attributes:
                properties:
                  name:
                    example: Example Test Parameter value
                    type: string
                  value:
                    example: Example Test Parameter value
                    type: string
                type: object
