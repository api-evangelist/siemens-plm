      parameters:
      - name: resourceType
        in: path
        description: The Resource Type.
        required: true
        schema:
          type: string
      - name: targetType
        in: path
        description: The Custom Field target type. (Use '~' when there is no specific type for the Prototype.)
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
