    plansListGetResponse:
      properties:
        data:
          items:
            properties:
              type:
                enum:
                - plans
                type: string
              id:
                example: MyProjectId/MyPlanId
                type: string
              revision:
                example: '1234'
                type: string
              attributes:
                properties:
                  allowedTypes:
                    items:
                      example: optionId
                      type: string
                    type: array
                  calculationType:
                    enum:
                    - timeBased
                    - customFieldBased
                    example: timeBased
                    type: string
                  capacity:
                    type: number
                  color:
                    example: Color
                    type: string
                  created:
                    example: '1970-01-01T00:00:00Z'
                    format: date-time
                    type: string
                  defaultEstimate:
                    type: number
                  description:
                    properties:
                      type:
                        enum:
                        - text/plain
                        type: string
                      value:
                        example: My text value
                        type: string
                    type: object
                  dueDate:
                    example: '1970-01-01'
                    format: date
                    type: string
                  estimationField:
                    example: Estimation Field
                    type: string
                  finishedOn:
                    example: '1970-01-01T00:00:00Z'
                    format: date-time
                    type: string
                  homePageContent:
                    properties:
                      type:
                        enum:
                        - text/html
                        - text/plain
                        type: string
                      value:
                        example: My text value
                        type: string
                    type: object
                  id:
                    example: ID
                    type: string
                  isTemplate:
                    type: boolean
                  name:
                    example: Name
                    type: string
                  previousTimeSpent:
                    example: 5 1/2d
                    type: string
                  prioritizationField:
                    example: Prioritization Field
                    type: string
                  sortOrder:
                    example: 0
                    format: int32
                    type: integer
                  startDate:
                    example: '1970-01-01'
                    format: date
                    type: string
                  startedOn:
                    example: '1970-01-01T00:00:00Z'
                    format: date-time
                    type: string
                  status:
                    type: string
                  updated:
                    example: '1970-01-01T00:00:00Z'
                    format: date-time
                    type: string
                  useReportFromTemplate:
                    type: boolean
                type: object
              relationships:
                properties:
                  author:
                    properties:
                      data:
                        properties:
