        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/document_commentsSingleGetResponse'
          description: OK
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '406':
          description: Not Acceptable
        4XX-5XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
          description: 'Error responses have the following structure:'
        '500':
          description: Internal Server Error
        '503':
          description: Service Unavailable
      summary: Returns the specified Document Comment.
      tags:
      - Document Comments
    patch:
      operationId: patchDocumentComment
      parameters:
      - name: projectId
        in: path
        description: The Project ID.
        required: true
        schema:
          type: string
      - name: spaceId
        in: path
        description: The Space ID. (Use '_default' without quotes to address the default Space.)
        required: true
        schema:
          type: string
      - name: documentName
        in: path
        description: The Document name.
        required: true
        schema:
          type: string
      - name: commentId
        in: path
        description: The Comment ID.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/document_commentsSinglePatchRequest'
        description: The Comment body.
        required: true
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '409':
          description: Conflict
        '413':
          description: Request Entity Too Large
        '415':
          description: Unsupported Media Type
        4XX-5XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
          description: 'Error responses have the following structure:'
        '500':
          description: Internal Server Error
        '503':
          description: Service Unavailable
      summary: Updates the specified Document Comment.
      tags:
      - Document Comments
